<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>心血管疾病患者居家心脏康复自我管理数字平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            boxShadow: { soft: '0 10px 30px rgba(15, 23, 42, 0.08)' },
            colors: {
              medical: { 50: '#eef8ff', 100: '#d9f0ff', 500: '#0f8ec7', 700: '#0d5d87', 900: '#15364d' },
              care: { 50: '#f3f8f5', 100: '#dff3e9', 500: '#2e9d7a', 700: '#1f6f57' },
              risk: { 50: '#fff5f5', 100: '#ffe3e3', 500: '#ef4444', 700: '#b91c1c' },
              warn: { 50: '#fffaf0', 100: '#fef0c7', 500: '#f59e0b', 700: '#b45309' }
            }
          }
        }
      };
    </script>
    <style>
      :root {
        --bg: #f3f7fb;
        --card: rgba(255,255,255,0.86);
        --line: rgba(148,163,184,0.25);
        --medical: #0f8ec7;
        --medical-700: #0d5d87;
        --emerald: #2e9d7a;
        --amber: #f59e0b;
        --red: #ef4444;
      }
      html { scroll-behavior: smooth; }
      body {
        font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top left, rgba(29, 78, 216, 0.18), transparent 18%),
          radial-gradient(circle at top right, rgba(16, 185, 129, 0.12), transparent 22%),
          var(--bg);
        color: #0f172a;
      }
      .glass { background: rgba(255,255,255,0.82); backdrop-filter: blur(10px); }
      .module-btn { border: 1px solid rgba(148,163,184,0.25); transition: all 0.2s ease; }
      .module-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(15, 23, 42, 0.08); }
      .badge-dot { width:11px; height:11px; border-radius:999px; display:inline-block; }
      .flow-bar { position:relative; height:14px; background:linear-gradient(90deg, rgba(59,130,246,0.12), rgba(59,130,246,0.25)); border-radius:999px; }
      .flow-bar::after { content:""; position:absolute; inset:0; background:linear-gradient(90deg, rgba(14,116,144,0.18), rgba(59,130,246,0.25), rgba(14,116,144,0.18)); border-radius:inherit; }
      .choice-card.selected { border-color:#0f8ec7; box-shadow:0 18px 38px rgba(15, 142, 199, 0.18); background:linear-gradient(180deg, rgba(219,244,255,0.9), rgba(255,255,255,0.96)); }
      .choice-card:not(.selected) { border-color: rgba(148,163,184,0.28); }
      .toast { opacity:0; transform: translateY(12px); transition: all 0.25s ease; }
      .toast.show { opacity:1; transform: translateY(0); }
      .stat-card { cursor:pointer; }
      .table-scroll { overflow-x:auto; }
      table { border-collapse: collapse; width:100%; }
      th, td { padding:0.7rem 0.8rem; border-bottom:1px solid #e2e8f0; text-align:left; }
      .chip { display:inline-flex; align-items:center; border-radius:9999px; padding:0.25rem 0.75rem; font-size:0.7rem; font-weight:700; }
      .status-chip { display:inline-flex; align-items:center; border-radius:9999px; padding:0.2rem 0.7rem; font-size:0.7rem; font-weight:700; }
      .page-shell { max-width: 1400px; margin: 0 auto; padding: 1.3rem 0.9rem 2.2rem; }
      .nav-link.active { color: var(--medical-700); background: rgba(15,142,199,0.08); }
      .panel { background: rgba(255,255,255,0.9); border: 1px solid rgba(148,163,184,0.2); border-radius: 26px; box-shadow: 0 10px 30px rgba(15,23,42,0.06); }
      .label { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #64748b; }
      .muted { color:#64748b; }
      .danger { color: #b91c1c; }
      .soft-button { border: 1px solid #dbe3ee; background: #f8fafc; border-radius: 999px; padding: 0.55rem 1rem; font-weight: 600; }
      .soft-button:hover { background: #eef3f9; }
      .grid-2 { display:grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
      @media (max-width: 768px) {
        .grid-2 { grid-template-columns: 1fr; }
      }
      input, select, textarea, button { font: inherit; }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script>
      const STORAGE_KEY = 'cvd-demo-data-v1';
      const DEMO_NOTICE = '本平台为护理学研究原型，所有患者信息、健康数据、康复计划和随访记录均为模拟数据，仅用于界面演示与交互测试。';
      const routeMeta = {
        '/home': '首页工作台',
        '/patients': '患者管理',
        '/health': '健康数据中心',
        '/plans': '康复计划',
        '/followups': '随访管理',
        '/events': '风险事件',
        '/education': '健康教育',
        '/ai': 'AI问答演示',
        '/profiles': '患者画像',
        '/dce': 'DCE演示',
        '/system': '系统说明'
      };
      const NAV_ITEMS = [
        { path: '/home', label: '首页' },
        { path: '/patients', label: '患者管理' },
        { path: '/health', label: '健康数据' },
        { path: '/plans', label: '康复计划' },
        { path: '/followups', label: '随访管理' },
        { path: '/events', label: '风险事件' },
        { path: '/education', label: '健康教育' },
        { path: '/ai', label: 'AI问答' },
        { path: '/profiles', label: '画像' },
        { path: '/dce', label: 'DCE' },
        { path: '/system', label: '系统说明' }
      ];

      const CHINESE_NAMES = [
        '赵晓梅','钱建国','孙丽华','周志强','吴雅琴','郑伟','王桂英','李明','陈静','刘海峰',
        '杨秀英','张勇','田丽丽','胡斌','高芳','林杰','徐敏','马宏','曹媛','许文涛',
        '何海燕','曾刚','罗玲','韩涛','宋红','沈峰','梁梅','曾艳','唐安','薛强'
      ];
      const DISEASE_TYPES = [
        '冠心病', '冠心病合并高血压', '心肌梗死恢复期', '冠脉介入治疗术后', '冠心病合并糖尿病', '心律失常', '心衰早期'
      ];
      const STAGES = ['早期康复', '恢复期', '中期康复', '维护期'];
      const DIGITAL_SKILLS = ['基础使用','中等使用','熟练使用','需家属协助'];
      const NEEDS = ['记录血压和心率','坚持有氧运动','规律服药提醒','控制盐分摄入','提升睡眠质量','提高数字工具使用能力'];
      const FOLLOWUP_MODES = ['电话随访', '门诊复诊', '微信提醒', '社区护士上门'];
      const PLAN_STATUS = ['待开始', '进行中', '已完成', '延期'];

      function uid(prefix='id') {
        return prefix + '-' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-6);
      }
      function formatDate(value) {
        if (!value) return '—';
        const date = new Date(value + 'T00:00:00');
        if (Number.isNaN(date.getTime())) return value;
        return date.toLocaleDateString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit' });
      }
      function formatDateTime(value) {
        if (!value) return '—';
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return value;
        return date.toLocaleString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
      }

      function generateSeedData() {
        const patients = [];
        const healthRecords = [];
        const rehabPlans = [];
        const followUps = [];
        const riskEvents = [];

        const baseDates = ['2026-10-13','2026-10-14','2026-10-15','2026-10-16','2026-10-17','2026-10-18','2026-10-19'];

        for (let i = 0; i < 30; i += 1) {
          const patientId = `P${String(i + 1).padStart(4, '0')}`;
          const age = 48 + ((i * 7) % 33);
          const gender = i % 2 === 0 ? '女' : '男';
          const diagnosis = DISEASE_TYPES[i % DISEASE_TYPES.length];
          const rehabStage = STAGES[i % STAGES.length];
          const digitalSkill = DIGITAL_SKILLS[i % DIGITAL_SKILLS.length];
          const need = NEEDS[i % NEEDS.length];
          const followMode = FOLLOWUP_MODES[i % FOLLOWUP_MODES.length];
          const lastRecordDate = baseDates[(i + 5) % baseDates.length];

          patients.push({
            id: patientId,
            name: CHINESE_NAMES[i],
            age,
            gender,
            diagnosis,
            rehabStage,
            digitalSkill,
            primaryNeed: need,
            followupMode: followMode,
            lastRecordDate,
            isDemo: true,
            note: '模拟数据：仅用于界面演示'
          });

          const baseWeight = 58 + (i % 7) * 4.8 + (i % 3) * 1.6;
          for (let d = 0; d < baseDates.length; d += 1) {
            const date = baseDates[d];
            const fluctuation = ((i * 11 + d * 7) % 9) - 4;
            const systolic = 110 + (i % 6) * 7 + d * 2 + fluctuation + (i % 3 === 0 ? 4 : 0);
            const diastolic = 68 + (i % 4) * 4 + (d % 3) + (fluctuation > 0 ? 1 : 0);
            const heartRate = 62 + (i % 5) * 3 + (d % 4) + (i % 2 === 0 ? 2 : 0);
            const weight = Number((baseWeight + (d * 0.25) + (i % 4) * 0.4 + ((d + i) % 2) * 0.15).toFixed(1));
            const workoutMinutes = 18 + (i % 5) * 9 + d * 5 + ((i + d) % 3) * 7;
            const sleepHours = 5.6 + ((i + d) % 4) * 0.6 + (d % 3 === 0 ? 0.4 : 0);

            healthRecords.push({
              id: uid('record'),
              patientId,
              date,
              systolic,
              diastolic,
              heartRate,
              weight,
              workoutMinutes,
              sleepHours: Number(sleepHours.toFixed(1)),
              note: '模拟数据：近期健康记录',
              isDemo: true
            });
          }

          const planStart = `2026-${String(9 + (i % 3)).padStart(2, '0')}-0${(i % 8) + 1}`;
          const planEnd = `2026-${String(10 + ((i + 2) % 2)).padStart(2, '0')}-2${(i % 8) + 5}`;
          const completion = 52 + ((i * 7) % 42);
          const statusIndex = i % PLAN_STATUS.length;
          rehabPlans.push({
            id: uid('plan'),
            patientId,
            planName: `${CHINESE_NAMES[i]}的居家康复计划`,
            startDate: planStart,
            endDate: planEnd,
            goal: '在模拟环境中保持规律运动、血压监测和自我管理，促进心脏康复持续性。',
            weeklyTasks: [
              '每周完成 3 次 20–30 分钟有氧运动',
              '每天记录血压、心率和睡眠质量',
              '按医嘱服药并记录不良反应',
              '每周一次健康教育学习与复盘'
            ],
            currentCompletion: completion,
            status: PLAN_STATUS[statusIndex],
            isDemo: true
          });

          const followupCount = i % 3 === 0 ? 2 : 1;
          for (let f = 0; f < followupCount; f += 1) {
            const dueDate = `2026-10-${String((15 + i + f) % 27 + 1).padStart(2, '0')}`;
            const status = f === 0 ? '已完成' : '待随访';
            followUps.push({
              id: uid('followup'),
              patientId,
              patientName: CHINESE_NAMES[i],
              dueDate,
              method: FOLLOWUP_MODES[(i + f) % FOLLOWUP_MODES.length],
              status,
              result: status === '已完成' ? '模拟数据显示患者自我管理遵从度提升。' : '模拟数据：等待患者反馈。',
              note: '模拟数据：仅用于界面演示',
              isDemo: true
            });
          }

          if (i < 15) {
            riskEvents.push({
              id: uid('event'),
              patientId,
              patientName: CHINESE_NAMES[i],
              eventType: i % 2 === 0 ? '健康数据异常提示' : '患者主动反馈',
              description: i % 2 === 0 ? '模拟记录显示近三天活动量低于计划目标。' : '模拟记录显示患者偶有胸闷不适，需进一步观察。',
              eventTime: `2026-10-${String(14 + (i % 6)).padStart(2, '0')}T09:30:00`,
              status: ['待评估', '处理中', '已完成', '待联系'][i % 4],
              isDemo: true
            });
          }
        }

        return { patients, healthRecords, rehabPlans, followUps, riskEvents, lastUpdated: new Date().toISOString() };
      }

      function readStore() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) {
            const initial = generateSeedData();
            localStorage.setItem(STORAGE_KEY, JSON.stringify(initial));
            return initial;
          }
          const parsed = JSON.parse(raw);
          if (!parsed || !parsed.patients || !Array.isArray(parsed.patients)) {
            const initial = generateSeedData();
            localStorage.setItem(STORAGE_KEY, JSON.stringify(initial));
            return initial;
          }
          return parsed;
        } catch (error) {
          console.warn('readStore failed', error);
          const initial = generateSeedData();
          localStorage.setItem(STORAGE_KEY, JSON.stringify(initial));
          return initial;
        }
      }

      function writeStore(data) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      }

      function resetStore() {
        const seed = generateSeedData();
        writeStore(seed);
        renderApp();
      }

      function getDashboardStats(store = readStore()) {
        const totalPatients = store.patients.length;
        const totalRecords = store.healthRecords.length;
        const completedPlans = store.rehabPlans.filter(plan => Number(plan.currentCompletion) >= 80).length;
        const totalPlans = store.rehabPlans.length;
        const completionRate = totalPlans ? Number(((completedPlans / totalPlans) * 100).toFixed(1)) : 0;
        const pendingFollowUps = store.followUps.filter(item => item.status === '待随访').length;
        const activeAlerts = store.riskEvents.filter(item => item.status !== '已完成').length;
        return {
          totalPatients,
          totalRecords,
          completionRate,
          pendingFollowUps,
          activeAlerts,
          totalPlans,
          totalFollowUps: store.followUps.length
        };
      }

      function navLink(path) {
        return `<a href="#${path}" class="nav-link ${location.hash === '#' + path || (!location.hash && path === '/home') ? 'active' : ''} inline-flex items-center gap-2 rounded-full px-3 py-2 text-sm font-semibold text-slate-600">${NAV_ITEMS.find(item => item.path === path)?.label || '首页'}</a>`;
      }

      function renderHomePage(store) {
        const stats = getDashboardStats(store);
        const recentRecords = [...store.healthRecords].sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 5);
        const recentPatients = [...store.patients].slice(0, 6);
        return `
          <div class="mb-6 flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
            <div>
              <div class="label">心血管疾病居家康复平台</div>
              <h1 class="mt-2 text-3xl font-bold text-slate-800">首页工作台</h1>
            </div>
            <div class="flex items-center gap-3">
              <span class="chip bg-blue-50 text-blue-700">模拟数据</span>
              <button id="resetDemoData" class="soft-button text-slate-700">恢复演示初始数据</button>
            </div>
          </div>

          <div class="mb-6 rounded-2xl border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-800">
            ${DEMO_NOTICE}
          </div>

          <div class="grid gap-4 md:grid-cols-2 xl:grid-cols-4">
            <div class="stat-card panel p-5">
              <div class="label">患者人数</div>
              <div class="mt-3 text-3xl font-bold text-medical-700">${stats.totalPatients}</div>
              <div class="mt-2 text-sm text-slate-500">模拟数据：共 ${stats.totalPatients} 名虚构患者</div>
            </div>
            <div class="stat-card panel p-5">
              <div class="label">健康记录</div>
              <div class="mt-3 text-3xl font-bold text-emerald-700">${stats.totalRecords}</div>
              <div class="mt-2 text-sm text-slate-500">累计近 7 天记录</div>
            </div>
            <div class="stat-card panel p-5">
              <div class="label">任务完成率</div>
              <div class="mt-3 text-3xl font-bold text-amber-700">${stats.completionRate}%</div>
              <div class="mt-2 text-sm text-slate-500">计划达标比例</div>
            </div>
            <div class="stat-card panel p-5">
              <div class="label">待随访</div>
              <div class="mt-3 text-3xl font-bold text-red-700">${stats.pendingFollowUps}</div>
              <div class="mt-2 text-sm text-slate-500">当前需处理的随访任务</div>
            </div>
          </div>

          <div class="mt-6 grid gap-5 xl:grid-cols-[1.4fr_1fr]">
            <div class="panel p-5">
              <div class="mb-4 flex items-center justify-between">
                <h2 class="text-lg font-bold text-slate-800">近期健康数据</h2>
                <span class="chip bg-cyan-50 text-cyan-700">模拟数据</span>
              </div>
              <div class="overflow-x-auto">
                <table>
                  <thead>
                    <tr class="text-left text-sm text-slate-500">
                      <th>患者</th>
                      <th>日期</th>
                      <th>收缩压</th>
                      <th>舒张压</th>
                      <th>心率</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${recentRecords.map(record => {
                      const patient = store.patients.find(item => item.id === record.patientId);
                      return `<tr>
                        <td class="font-semibold text-slate-700">${patient ? patient.name : record.patientId}</td>
                        <td>${formatDate(record.date)}</td>
                        <td>${record.systolic} mmHg</td>
                        <td>${record.diastolic} mmHg</td>
                        <td>${record.heartRate} bpm</td>
                      </tr>`;
                    }).join('')}
                  </tbody>
                </table>
              </div>
            </div>

            <div class="panel p-5">
              <div class="mb-4 flex items-center justify-between">
                <h2 class="text-lg font-bold text-slate-800">患者概览</h2>
                <span class="chip bg-emerald-50 text-emerald-700">模拟数据</span>
              </div>
              <div class="space-y-3">
                ${recentPatients.map(patient => `<div class="rounded-2xl border border-slate-200 p-3">
                  <div class="flex items-center justify-between">
                    <div>
                      <div class="font-semibold text-slate-800">${patient.name}</div>
                      <div class="text-xs text-slate-500">${patient.id} · ${patient.diagnosis}</div>
                    </div>
                    <span class="status-chip bg-blue-50 text-blue-700">${patient.rehabStage}</span>
                  </div>
                </div>`).join('')}
              </div>
            </div>
          </div>
        `;
      }

      function renderPatientsPage(store) {
        return `
          <div class="mb-6 flex items-center justify-between gap-3">
            <div>
              <div class="label">患者管理</div>
              <h1 class="mt-2 text-3xl font-bold text-slate-800">患者列表</h1>
            </div>
            <span class="chip bg-blue-50 text-blue-700">模拟数据</span>
          </div>
          <div class="panel p-4">
            <div class="table-scroll">
              <table>
                <thead>
                  <tr class="text-left text-sm text-slate-500">
                    <th>患者编号</th>
                    <th>姓名</th>
                    <th>年龄</th>
                    <th>性别</th>
                    <th>疾病类型</th>
                    <th>康复阶段</th>
                    <th>数字工具使用能力</th>
                    <th>主要自我管理需求</th>
                    <th>随访方式</th>
                    <th>最近健康记录</th>
                  </tr>
                </thead>
                <tbody>
                  ${store.patients.map(patient => `
                    <tr>
                      <td class="font-semibold text-slate-800">${patient.id}</td>
                      <td>${patient.name}</td>
                      <td>${patient.age}</td>
                      <td>${patient.gender}</td>
                      <td>${patient.diagnosis}</td>
                      <td>${patient.rehabStage}</td>
                      <td>${patient.digitalSkill}</td>
                      <td>${patient.primaryNeed}</td>
                      <td>${patient.followupMode}</td>
                      <td>${formatDate(patient.lastRecordDate)}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      function renderHealthPage(store) {
        const patientIds = store.patients.slice(0, 6).map(item => item.id);
        return `
          <div class="mb-6 flex items-center justify-between gap-3">
            <div>
              <div class="label">健康数据中心</div>
              <h1 class="mt-2 text-3xl font-bold text-slate-800">最近 7 天健康记录</h1>
            </div>
            <span class="chip bg-emerald-50 text-emerald-700">模拟数据</span>
          </div>
          <div class="space-y-5">
            ${patientIds.map(patientId => {
              const patient = store.patients.find(item => item.id === patientId);
              const records = store.healthRecords.filter(item => item.patientId === patientId).slice(-7);
              return `
                <div class="panel p-4">
                  <div class="mb-3 flex items-center justify-between">
                    <div>
                      <div class="text-lg font-bold text-slate-800">${patient.name} (${patient.id})</div>
                      <div class="text-sm text-slate-500">${patient.diagnosis} · 最近 7 天记录</div>
                    </div>
                    <span class="chip bg-slate-100 text-slate-700">模拟数据</span>
                  </div>
                  <div class="table-scroll">
                    <table>
                      <thead>
                        <tr class="text-left text-sm text-slate-500">
                          <th>日期</th>
                          <th>收缩压</th>
                          <th>舒张压</th>
                          <th>静息心率</th>
                          <th>体重</th>
                          <th>每日运动时间</th>
                          <th>睡眠时间</th>
                        </tr>
                      </thead>
                      <tbody>
                        ${records.map(record => `
                          <tr>
                            <td>${formatDate(record.date)}</td>
                            <td>${record.systolic} mmHg</td>
                            <td>${record.diastolic} mmHg</td>
                            <td>${record.heartRate} bpm</td>
                            <td>${record.weight} kg</td>
                            <td>${record.workoutMinutes} min</td>
                            <td>${record.sleepHours} h</td>
                          </tr>
                        `).join('')}
                      </tbody>
                    </table>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      function renderPlansPage(store) {
        return `
          <div class="mb-6 flex items-center justify-between gap-3">
            <div>
              <div class="label">康复计划</div>
              <h1 class="mt-2 text-3xl font-bold text-slate-800">模拟康复计划</h1>
            </div>
            <span class="chip bg-amber-50 text-amber-700">模拟数据</span>
          </div>
          <div class="grid gap-4 xl:grid-cols-2">
            ${store.rehabPlans.slice(0, 10).map(plan => {
              const patient = store.patients.find(item => item.id === plan.patientId);
              return `
                <div class="panel p-5">
                  <div class="mb-3 flex items-start justify-between gap-3">
                    <div>
                      <div class="text-lg font-bold text-slate-800">${plan.planName}</div>
                      <div class="text-sm text-slate-500">${patient ? patient.name : plan.patientId} · ${plan.startDate} 至 ${plan.endDate}</div>
                    </div>
                    <span class="status-chip ${plan.status === '进行中' ? 'bg-blue-50 text-blue-700' : plan.status === '已完成' ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-700'}">${plan.status}</span>
                  </div>
                  <div class="mb-3">
                    <div class="mb-1 text-sm font-semibold text-slate-600">康复目标</div>
                    <div class="text-sm text-slate-600">${plan.goal}</div>
                  </div>
                  <div class="mb-3">
                    <div class="mb-1 text-sm font-semibold text-slate-600">每周任务</div>
                    <ul class="list-disc pl-5 text-sm text-slate-600">
                      ${plan.weeklyTasks.map(task => `<li>${task}</li>`).join('')}
                    </ul>
                  </div>
                  <div>
                    <div class="mb-2 flex items-center justify-between text-sm text-slate-600">
                      <span>当前完成情况</span>
                      <span>${plan.currentCompletion}%</span>
                    </div>
                    <div class="flow-bar">
                      <div class="h-full rounded-full bg-gradient-to-r from-medical-500 to-care-500" style="width:${plan.currentCompletion}%"></div>
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      function renderFollowUpsPage(store) {
        return `
          <div class="mb-6 flex items-center justify-between gap-3">
            <div>
              <div class="label">随访管理</div>
              <h1 class="mt-2 text-3xl font-bold text-slate-800">随访记录</h1>
            </div>
            <span class="chip bg-blue-50 text-blue-700">模拟数据</span>
          </div>
          <div class="panel p-4">
            <div class="table-scroll">
              <table>
                <thead>
                  <tr class="text-left text-sm text-slate-500">
                    <th>患者</th>
                    <th>计划日期</th>
                    <th>随访方式</th>
                    <th>状态</th>
                    <th>结果</th>
                    <th>备注</th>
                  </tr>
                </thead>
                <tbody>
                  ${store.followUps.map(item => `
                    <tr>
                      <td>${item.patientName}</td>
                      <td>${formatDate(item.dueDate)}</td>
                      <td>${item.method}</td>
                      <td><span class="status-chip ${item.status === '已完成' ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-700'}">${item.status}</span></td>
                      <td>${item.result}</td>
                      <td>${item.note}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      function renderEventsPage(store) {
        return `
          <div class="mb-6 flex items-center justify-between gap-3">
            <div>
              <div class="label">风险事件</div>
              <h1 class="mt-2 text-3xl font-bold text-slate-800">风险事件列表</h1>
            </div>
            <span class="chip bg-red-50 text-red-700">模拟数据</span>
          </div>
          <div class="space-y-4">
            ${store.riskEvents.map(item => `
              <div class="panel p-4">
                <div class="mb-2 flex items-center justify-between">
                  <div class="font-bold text-slate-800">${item.patientName} · ${item.eventType}</div>
                  <span class="status-chip ${item.status === '已完成' ? 'bg-emerald-50 text-emerald-700' : 'bg-red-50 text-red-700'}">${item.status}</span>
                </div>
                <div class="text-sm text-slate-600">${item.description}</div>
                <div class="mt-2 text-xs text-slate-500">事件时间：${formatDateTime(item.eventTime)}</div>
              </div>
            `).join('')}
          </div>
        `;
      }

      function renderEducationPage() {
        return `
          <div class="mb-6 flex items-center justify-between gap-3">
            <div>
              <div class="label">健康教育</div>
              <h1 class="mt-2 text-3xl font-bold text-slate-800">模拟教育内容</h1>
            </div>
            <span class="chip bg-cyan-50 text-cyan-700">模拟数据</span>
          </div>
          <div class="grid gap-4 md:grid-cols-2 xl:grid-cols-3">
            ${[ '冠心病基础知识', '居家心脏康复的基本原则', '合理膳食与低盐饮食', '药物管理与安全用药', '心理调适与睡眠管理', '危险信号识别与复诊' ].map((item, index) => `
              <div class="panel p-5">
                <div class="mb-2 text-xs font-semibold uppercase tracking-[0.15em] text-slate-500">专题 ${index + 1}</div>
                <h3 class="text-lg font-bold text-slate-800">${item}</h3>
                <p class="mt-3 text-sm text-slate-600">模拟数据：仅用于演示平台教育内容，展示重点知识点与提醒事项。重点强调居家心脏康复管理中的安全与持续性。</p>
              </div>
            `).join('')}
          </div>
        `;
      }

      function renderAiPage() {
        return `
          <div class="mb-6 flex items-center justify-between gap-3">
            <div>
              <div class="label">AI问答演示</div>
              <h1 class="mt-2 text-3xl font-bold text-slate-800">AI问答模块</h1>
            </div>
            <span class="chip bg-violet-50 text-violet-700">演示状态</span>
          </div>
          <div class="panel p-6 text-slate-700">
            当前阶段暂不开发 AI 问答功能，本页面仅保留演示入口。所有文本均为模拟数据，不用于真实医疗问答。
          </div>
        `;
      }

      function renderProfilesPage(store) {
        return `
          <div class="mb-6 flex items-center justify-between gap-3">
            <div>
              <div class="label">患者画像</div>
              <h1 class="mt-2 text-3xl font-bold text-slate-800">患者画像概览</h1>
            </div>
            <span class="chip bg-fuchsia-50 text-fuchsia-700">模拟数据</span>
          </div>
          <div class="grid gap-4 xl:grid-cols-2">
            ${store.patients.slice(0, 8).map(patient => `
              <div class="panel p-5">
                <div class="mb-3 flex items-center justify-between">
                  <div>
                    <div class="text-lg font-bold text-slate-800">${patient.name}</div>
                    <div class="text-sm text-slate-500">${patient.id} · ${patient.diagnosis}</div>
                  </div>
                  <span class="status-chip bg-violet-50 text-violet-700">${patient.rehabStage}</span>
                </div>
                <div class="grid grid-cols-2 gap-3 text-sm text-slate-600">
                  <div><span class="font-semibold">年龄：</span>${patient.age}</div>
                  <div><span class="font-semibold">性别：</span>${patient.gender}</div>
                  <div><span class="font-semibold">数字能力：</span>${patient.digitalSkill}</div>
                  <div><span class="font-semibold">随访方式：</span>${patient.followupMode}</div>
                </div>
                <div class="mt-3 text-sm text-slate-600"><span class="font-semibold">管理需求：</span>${patient.primaryNeed}</div>
              </div>
            `).join('')}
          </div>
        `;
      }

      function renderDcePage() {
        return `
          <div class="mb-6 flex items-center justify-between gap-3">
            <div>
              <div class="label">DCE演示</div>
              <h1 class="mt-2 text-3xl font-bold text-slate-800">离散选择实验</h1>
            </div>
            <span class="chip bg-indigo-50 text-indigo-700">模拟数据</span>
          </div>
          <div class="space-y-4">
            ${[
              ['若需选择居家心脏康复服务方式，您更倾向于哪项？', '社区护士电话随访', '线上平台记录+远程指导'],
              ['如果服务摊位不同，您更关注什么？', '成本较低', '服务更全面'],
              ['您更希望随访频率如何？', '每周一次', '每两周一次']
            ].map(([question, left, right], index) => `
              <div class="panel p-5">
                <div class="mb-3 text-base font-bold text-slate-800">${index + 1}. ${question}</div>
                <div class="grid gap-3 md:grid-cols-2">
                  <div class="choice-card selected rounded-2xl border p-4">
                    <div class="font-semibold text-slate-800">方案 A</div>
                    <div class="mt-1 text-sm text-slate-600">${left}</div>
                  </div>
                  <div class="choice-card rounded-2xl border p-4">
                    <div class="font-semibold text-slate-800">方案 B</div>
                    <div class="mt-1 text-sm text-slate-600">${right}</div>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      }

      function renderSystemPage() {
        return `
          <div class="mb-6 flex items-center justify-between gap-3">
            <div>
              <div class="label">系统说明</div>
              <h1 class="mt-2 text-3xl font-bold text-slate-800">平台说明</h1>
            </div>
            <span class="chip bg-slate-100 text-slate-700">演示说明</span>
          </div>
          <div class="space-y-4 panel p-6 text-slate-700">
            <p>本系统用于展示心血管疾病患者居家心脏康复自我管理平台原型。</p>
            <p>所有患者信息、健康记录、康复计划和风险事件均为模拟数据，不能被当作真实病历或真实患者资料。</p>
            <p>本页面通过浏览器 localStorage 保存演示数据，刷新后数据保持可见。可使用“恢复演示初始数据”按钮回到初始演示状态。</p>
          </div>
        `;
      }

      function renderRouteContent(route, store) {
        switch (route) {
          case '/patients': return renderPatientsPage(store);
          case '/health': return renderHealthPage(store);
          case '/plans': return renderPlansPage(store);
          case '/followups': return renderFollowUpsPage(store);
          case '/events': return renderEventsPage(store);
          case '/education': return renderEducationPage();
          case '/ai': return renderAiPage();
          case '/profiles': return renderProfilesPage(store);
          case '/dce': return renderDcePage();
          case '/system': return renderSystemPage();
          case '/home':
          default: return renderHomePage(store);
        }
      }

      function renderApp() {
        const route = location.hash.replace(/^#/, '') || '/home';
        const safeRoute = routeMeta[route] ? route : '/home';
        const store = readStore();
        const stats = getDashboardStats(store);

        document.getElementById('app').innerHTML = `
          <div class="page-shell">
            <header class="sticky top-0 z-30 mb-5">
              <div class="glass mx-auto flex max-w-6xl flex-col gap-4 rounded-2xl border border-slate-200/70 px-4 py-3 shadow-soft md:flex-row md:items-center md:justify-between">
                <div class="flex items-center gap-3">
                  <div class="flex h-11 w-11 items-center justify-center rounded-xl bg-gradient-to-br from-medical-500 to-medical-700 text-lg font-bold text-white">心</div>
                  <div>
                    <div class="text-[10px] font-semibold uppercase tracking-[0.2em] text-slate-500">CVD CARE</div>
                    <div class="text-base font-bold text-slate-800">心血管疾病居家康复数字平台</div>
                  </div>
                </div>
                <div class="flex flex-wrap items-center gap-2">
                  ${NAV_ITEMS.map(item => navLink(item.path)).join('')}
                </div>
              </div>
            </header>

            <main class="mx-auto max-w-6xl">
              <div class="mb-4 flex items-center justify-between gap-3">
                <div class="text-sm text-slate-500">当前路径：${routeMeta[safeRoute]}</div>
                <div class="flex items-center gap-2">
                  <span class="chip bg-cyan-50 text-cyan-700">模拟数据</span>
                  <span class="chip bg-emerald-50 text-emerald-700">${stats.totalPatients} 患者</span>
                </div>
              </div>
              ${renderRouteContent(safeRoute, store)}
            </main>
          </div>
          <div id="globalToast" class="toast fixed bottom-5 right-5 rounded-xl bg-slate-900 px-4 py-2 text-sm font-medium text-white shadow-lg"></div>
        `;

        document.getElementById('resetDemoData')?.addEventListener('click', () => {
          resetStore();
          const toast = document.getElementById('globalToast');
          if (toast) {
            toast.textContent = '已恢复演示初始数据';
            toast.classList.add('show');
            clearTimeout(window.toastTimer);
            window.toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
          }
        });
      }

      window.addEventListener('hashchange', renderApp);
      renderApp();
    </script>
  </body>
</html>
