      const defaultEducationArticles = [
        { title: '心脏康复基础知识', category: '心脏康复基础知识', summary: '了解心脏康复的目的、形式和基本安全原则。', sourceName: 'American Heart Association', sourceYear: '2024', sourceUrl: 'https://www.heart.org/en/health-topics/consumer-healthcare/what-is-cardiac-rehabilitation', content: '心脏康复关注规律运动、健康教育、心理支持和生活方式调整，帮助患者恢复信心和体能。' },
        { title: '血压自测与记录方法', category: '血压、心率和体重监测', summary: '掌握基础的血压和心率自测方法。', sourceName: 'CDC', sourceYear: '2024', sourceUrl: 'https://www.cdc.gov/bloodpressure/about.htm', content: '规律测量和记录血压与心率，能够帮助患者及时了解变化趋势。' },
        { title: '适度运动与活动管理', category: '居家运动与活动管理', summary: '制定安全、可持续的运动计划。', sourceName: 'WHO', sourceYear: '2024', sourceUrl: 'https://www.who.int/news-room/fact-sheets/detail/physical-activity', content: '运动建议遵循循序渐进、量力而行和安全优先的原则。' },
        { title: '低盐饮食与睡眠管理', category: '饮食、睡眠和生活方式', summary: '保持低盐和规律作息，促进恢复。', sourceName: 'CDC', sourceYear: '2024', sourceUrl: 'https://www.cdc.gov/salt/index.htm', content: '低盐饮食和规律睡眠能辅助控制血压和改善恢复效果。' },
        { title: '药物管理与复诊随访', category: '用药管理与复诊随访', summary: '按时服药并定期复诊。', sourceName: 'FDA', sourceYear: '2024', sourceUrl: 'https://www.fda.gov/drugs/consumer-information-about-drug-labels', content: '药物治疗应遵循医生指导，不要自行停药、减药或加药。' },
        { title: '危险信号识别与就医提醒', category: '症状识别和就医提醒', summary: '识别可能需要紧急医疗帮助的症状。', sourceName: 'American Heart Association', sourceYear: '2024', sourceUrl: 'https://www.heart.org/en/health-topics/heart-attack/warning-signs-of-a-heart-attack', content: '胸痛、呼吸困难、明显头晕或晕厥等症状应尽快就医。' }
      ];

      const AI_KB = [
        { id: 'AI-01', category: '心脏康复基础知识', question: '什么是心脏康复？', alternativeQuestions: ['心脏康复是什么意思', '心脏康复有什么用'], keywords: ['心脏康复', '康复训练', '恢复', '运动计划'], answer: '心脏康复是针对心血管疾病患者的一种综合性管理方案，通常包括有氧运动训练、健康教育、心理支持、生活方式调整和药物依从性指导。其目的是帮助患者逐步恢复活动能力、提高自我管理能力，并降低再次住院和心血管事件风险。对于冠心病、心肌梗死后恢复、冠脉介入术后或心衰患者，康复计划应在医生或专业团队指导下制定。', sourceName: 'American Heart Association', sourceYear: '2024', sourceUrl: 'https://www.heart.org/en/health-topics/consumer-healthcare/what-is-cardiac-rehabilitation', disclaimer: '本答案仅为一般健康教育，不能代替医生面对面评估和个体化治疗方案。' },
        { id: 'AI-02', category: '心脏康复基础知识', question: '心脏康复为什么重要？', alternativeQuestions: ['做心脏康复有什么好处', '康复训练能不能帮助恢复'], keywords: ['康复重要性', '心脏恢复', '生活方式', '风险控制'], answer: '心脏康复有助于提高患者的体能、改善生活质量，并帮助患者掌握更安全的运动和生活方式。通过规律运动和健康教育，很多患者能够更好地控制血压、改善睡眠、减少焦虑，并提高对自我管理的信心。', sourceName: 'American Heart Association', sourceYear: '2024', sourceUrl: 'https://www.heart.org/en/health-topics/consumer-healthcare/what-is-cardiac-rehabilitation', disclaimer: '本答案仅为一般信息，不替代医生的个体化评估。' },
        { id: 'AI-03', category: '心脏康复基础知识', question: '参加心脏康复需要注意什么？', alternativeQuestions: ['做康复时要避免什么', '心脏康复期间要注意哪些事项'], keywords: ['注意事项', '运动强度', '心绞痛', '安全'], answer: '在心脏康复期间，最重要的是遵循“量力而行”和“医生指导”的原则。开始前应评估既往症状、运动耐量和药物情况，训练强度应逐步增加。若出现胸痛、明显气短、头晕、心悸加重或极度疲劳，应立即停止活动并及时联系医务人员。', sourceName: 'American Heart Association', sourceYear: '2024', sourceUrl: 'https://www.heart.org/en/health-topics/consumer-healthcare/what-is-cardiac-rehabilitation', disclaimer: '任何不适都应及时咨询医生，不可自行加大运动量。' },
        { id: 'AI-04', category: '心脏康复基础知识', question: '我做完支架或手术后，是否需要做心脏康复？', alternativeQuestions: ['手术后需要康复吗', '做完心脏手术还需要康复吗'], keywords: ['支架', 'PCI', '手术后', '术后恢复'], answer: '很多患者在冠脉介入、心梗后或其他心血管事件后，都需要进行康复评估。术后恢复并不等于“完全恢复”，恢复阶段常需要结合运动、药物、心理和生活方式管理。具体是否适合、何时开始、训练强度如何安排，需由医生根据病情和恢复情况决定。', sourceName: 'American Heart Association', sourceYear: '2024', sourceUrl: 'https://www.heart.org/en/health-topics/consumer-healthcare/what-is-cardiac-rehabilitation', disclaimer: '示例信息只能帮助理解，不可替代专业医生建议。' },
        { id: 'AI-05', category: '心脏康复基础知识', question: '心脏康复有没有年龄限制？', alternativeQuestions: ['老年人能不能做心脏康复', '年轻人也要做吗'], keywords: ['年龄', '老年人', '康复适应症'], answer: '心脏康复并不只针对年轻人，很多中老年患者都适合参与。是否适合主要取决于病情、稳定性、活动耐量和合并症，而不是简单按年龄来决定。', sourceName: 'American Heart Association', sourceYear: '2024', sourceUrl: 'https://www.heart.org/en/health-topics/consumer-healthcare/what-is-cardiac-rehabilitation', disclaimer: '任何训练方案都应在专业人员指导下进行。' },
        { id: 'AI-06', category: '血压、心率和体重监测', question: '在家里为什么要测血压？', alternativeQuestions: ['测血压有什么意义', '为什么要记录血压'], keywords: ['血压', '家庭监测', '高血压', '记录'], answer: '在家中测量血压可以帮助了解血压在不同时间的变化，有助于评估治疗效果，也能帮助发现异常波动。对于心脏康复患者来说，规律监测血压有助于及时发现血压偏高或偏低，便于调整生活方式和复诊时与医生沟通。', sourceName: 'CDC', sourceYear: '2024', sourceUrl: 'https://www.cdc.gov/bloodpressure/about.htm', disclaimer: '单次血压数值不能直接诊断疾病，需结合整体情况和医生评估。' },
        { id: 'AI-07', category: '血压、心率和体重监测', question: '每天需要记录哪些健康数据？', alternativeQuestions: ['健康记录有哪些', '我每天要看哪些指标'], keywords: ['记录', '血压', '心率', '体重', '睡眠'], answer: '常见需要记录的数据包括血压、静息心率、体重、运动时间和睡眠时间等。不同患者的记录重点可能不同，但长期规律记录更容易发现趋势，而不是只看单一天的数值。', sourceName: 'CDC', sourceYear: '2024', sourceUrl: 'https://www.cdc.gov/heartdisease/cardiac_rehabilitation.htm', disclaimer: '本回答仅用于一般健康管理，不代替专业医疗判断。' },
        { id: 'AI-08', category: '血压、心率和体重监测', question: '静息心率偏高应该怎么处理？', alternativeQuestions: ['心率快了怎么办', '静息心率异常是否危险'], keywords: ['静息心率', '心率异常', '心悸', '警示'], answer: '静息心率有个体差异，不能只凭一次数值判断是否异常。若心率持续偏快、伴随胸闷、气短、头晕或明显乏力，应及时记录时间和相关症状，并联系医生或医疗团队。', sourceName: 'American Heart Association', sourceYear: '2023', sourceUrl: 'https://www.heart.org/en/healthy-living/fitness/fitness-basics/target-heart-rates', disclaimer: '不能根据单次心率数据直接诊断疾病，需结合病史和检查。' },
        { id: 'AI-09', category: '血压、心率和体重监测', question: '体重变化是否和康复有关？', alternativeQuestions: ['为什么要记录体重', '体重涨了要紧吗'], keywords: ['体重', '水肿', '体重波动', '体重管理'], answer: '体重变化在心脏康复中有参考价值，因为它可能反映饮食、液体摄入、活动量和整体状态变化。若出现短期明显体重增加、双脚或小腿水肿、呼吸困难等情况，应及时告知医生。', sourceName: 'National Heart, Lung, and Blood Institute', sourceYear: '2022', sourceUrl: 'https://www.nhlbi.nih.gov/health/heart-failure', disclaimer: '体重变化是一个参考指标，不能单独作为诊断依据。' },
        { id: 'AI-10', category: '血压、心率和体重监测', question: '测血压时需要注意什么？', alternativeQuestions: ['怎么测血压更准确', '我家里测血压需要注意哪些细节'], keywords: ['测量方法', '血压计', '测量时间', '正确测量'], answer: '测量血压时，建议坐位休息5分钟，避免刚运动、喝咖啡或抽烟后立即测量，袖带位置应与上臂平齐，手臂放松并保持心脏同一高度。记录时最好记下时间、数值和当天状态。', sourceName: 'CDC', sourceYear: '2024', sourceUrl: 'https://www.cdc.gov/bloodpressure/measure.htm', disclaimer: '本答案为一般测量建议，不代替医生指导。' },
        { id: 'AI-11', category: '居家运动与活动管理', question: '我不想运动，怎么安排更容易坚持？', alternativeQuestions: ['每天运动太难怎么办', '运动计划做不下去怎么调整'], keywords: ['坚持', '运动计划', '活动量', '适度运动'], answer: '心脏康复中的运动应遵循“从小量到逐步增加”的原则。可以先从每天 10–20 分钟的步行或轻度活动开始，观察是否有胸闷、头晕、气短等不适。若身体状态稳定，再逐步增加时间和强度。', sourceName: 'WHO', sourceYear: '2024', sourceUrl: 'https://www.who.int/news-room/fact-sheets/detail/physical-activity', disclaimer: '运动安排需结合患者病情、用药和恢复情况，不可盲目增加。' },
        { id: 'AI-12', category: '居家运动与活动管理', question: '每天需要做多少运动？', alternativeQuestions: ['运动时间多少合适', '我每天要走多少步'], keywords: ['步数', '运动时间', '日常活动', '运动建议'], answer: '运动量应根据个人情况和医生建议来安排，通常是适度有氧活动为主。关键不是一味追求步数，而是要做到规律、持续和安全。可从短时间、低强度活动开始，并用耐受情况逐步提高。', sourceName: 'WHO', sourceYear: '2024', sourceUrl: 'https://www.who.int/news-room/fact-sheets/detail/physical-activity', disclaimer: '灵活调整需结合个人病情和医疗指导。' },
        { id: 'AI-13', category: '居家运动与活动管理', question: '运动中如果胸口不舒服怎么办？', alternativeQuestions: ['运动时胸闷怎么处理', '胸口疼痛如何处理'], keywords: ['胸痛', '胸闷', '气短', '运动停止'], answer: '如果在活动中出现明显胸痛、胸闷、呼吸困难、眩晕、冷汗或极度疲劳，应立即停止运动，坐下或休息，并尽快联系医生或急救服务。若症状严重、持续不缓解或伴有呼吸困难，应立即寻求紧急医疗帮助。', sourceName: 'American Heart Association', sourceYear: '2024', sourceUrl: 'https://www.heart.org/en/health-topics/heart-attack/warning-signs-of-a-heart-attack', disclaimer: '胸痛和胸闷可能意味着急症，不能自行观察等待。' },
        { id: 'AI-14', category: '居家运动与活动管理', question: '我忘记记录一天的运动怎么办？', alternativeQuestions: ['忘了运动怎么记录', '一天没运动是否影响康复'], keywords: ['运动记录', '计划中断', '遗漏', '坚持'], answer: '偶尔漏做一次运动不等于康复失败，重要的是及时回到计划中。可以在下一天轻松补做一段适度活动，避免“补救式剧烈运动”。关键是保持长期规律，而不是因某一天中断就完全放弃。', sourceName: 'WHO', sourceYear: '2024', sourceUrl: 'https://www.who.int/news-room/fact-sheets/detail/physical-activity', disclaimer: '不要为了补救而突然增加运动量。' },

      function generateSeedData() {
        const patients = [];
        const healthRecords = [];
        const rehabPlans = [];
        const rehabTasks = [];
        const followUps = [];
        const riskEvents = [];
        const educationArticles = defaultEducationArticles.map((article, index) => ({
          id: uid('article'),
          articleId: `A${String(index + 1).padStart(3, '0')}`,
          ...article,
          isDemo: true
        }));

        const baseDates = ['2026-10-13','2026-10-14','2026-10-15','2026-10-16','2026-10-17','2026-10-18','2026-10-19'];

        for (let i = 0; i < 30; i += 1) {
          const patientId = `P${String(i + 1).padStart(4, '0')}`;
          const age = 48 + ((i * 7) % 33);
          const gender = i % 2 === 0 ? '女' : '男';
          const diagnosis = DISEASE_TYPES[i % DISEASE_TYPES.length];
          const rehabStage = STAGES[i % STAGES.length];
          const digitalSkill = DIGITAL_SKILLS[i % DIGITAL_SKILLS.length];
          const need = NEEDS[i % NEEDS.length];
          const followMode = FOLLOWUP_MODES[i % FOLLOWUP_MODES.length];
          const patientName = CHINESE_NAMES[i];
          const lastRecordDate = baseDates[(i + 5) % baseDates.length];

          patients.push({
            id: patientId,
            name: patientName,
            age,
            gender,
            diagnosis,
            rehabStage,
            digitalSkill,
            primaryNeed: need,
            followupMode: followMode,
            lastRecordDate,
            isDemo: true,
            note: '模拟数据：仅用于界面演示'
          });

          const baseWeight = 58 + (i % 7) * 4.8 + (i % 3) * 1.6;
          for (let d = 0; d < baseDates.length; d += 1) {
            const date = baseDates[d];
            const fluctuation = ((i * 11 + d * 7) % 9) - 4;
            const systolic = 110 + (i % 6) * 7 + d * 2 + fluctuation + (i % 3 === 0 ? 4 : 0);
            const diastolic = 68 + (i % 4) * 4 + (d % 3) + (fluctuation > 0 ? 1 : 0);
            const heartRate = 62 + (i % 5) * 3 + (d % 4) + (i % 2 === 0 ? 2 : 0);
            const weight = Number((baseWeight + (d * 0.25) + (i % 4) * 0.4 + ((d + i) % 2) * 0.15).toFixed(1));
            const workoutMinutes = 18 + (i % 5) * 9 + d * 5 + ((i + d) % 3) * 7;
            const sleepHours = 5.6 + ((i + d) % 4) * 0.6 + (d % 3 === 0 ? 0.4 : 0);

            healthRecords.push({
              id: uid('record'),
              patientId,
              date,
              systolic,
              diastolic,
              heartRate,
              weight,
              workoutMinutes,
              sleepHours: Number(sleepHours.toFixed(1)),
              note: '模拟数据：近期健康记录',
              isDemo: true
            });
          }

          const planStart = `2026-${String(9 + (i % 3)).padStart(2, '0')}-0${(i % 8) + 1}`;
          const planEnd = `2026-${String(10 + ((i + 2) % 2)).padStart(2, '0')}-2${(i % 8) + 5}`;
          const plan = {
            id: uid('plan'),
            patientId,
            planName: `${patientName}的居家康复计划`,
            startDate: planStart,
            endDate: planEnd,
            goal: '保持规律运动、监测血压与心率、坚持自我管理，提高生活质量和恢复耐受。',
            weeklyTasks: [
              '每周完成 3 次 20–30 分钟有氧运动',
              '每天记录血压、心率和睡眠质量',
              '按医嘱服药并记录不良反应',
              '每周一次健康教育学习与复盘'
            ],
            currentCompletion: 0,
            status: '待开始',
            isDemo: true
          };
          rehabPlans.push(plan);

          const taskTemplates = [
            { taskName: '每日血压和心率记录', description: '在固定时间点记录血压和静息心率', dueDate: '2026-10-20', status: i % 2 === 0 ? '已完成' : '待完成' },
            { taskName: '有氧运动训练', description: '完成 20–30 分钟低强度活动', dueDate: '2026-10-21', status: i % 3 === 0 ? '已完成' : '待完成' },
            { taskName: '饮食和睡眠记录', description: '记录盐分摄入与睡眠情况', dueDate: '2026-10-22', status: i % 4 === 0 ? '已完成' : '待完成' },
            { taskName: '随访准备与复诊确认', description: '核对复诊时间并准备相关记录', dueDate: '2026-10-23', status: i % 5 === 0 ? '已完成' : '待完成' }
          ];

          taskTemplates.forEach(taskData => {
            rehabTasks.push({
              id: uid('task'),
              patientId,
              taskName: taskData.taskName,
              description: taskData.description,
              dueDate: taskData.dueDate,
              status: taskData.status,
              note: '模拟数据：用于演示任务联动',
              isDemo: true
            });
          });

          const followUpCount = i % 3 === 0 ? 2 : 1;
          for (let f = 0; f < followUpCount; f += 1) {
            const dueDate = `2026-10-${String((15 + i + f) % 27 + 1).padStart(2, '0')}`;
            const status = f === 0 ? '已完成' : '待随访';
            followUps.push({
              id: uid('followup'),
              patientId,
              patientName: patientName,
              dueDate,
              method: FOLLOWUP_MODES[(i + f) % FOLLOWUP_MODES.length],
              status,
              result: status === '已完成' ? '模拟数据显示患者自我管理遵从度提升。' : '模拟数据：等待患者反馈。',
              note: '模拟数据：仅用于界面演示',
              isDemo: true
            });
          }

          if (i < 15) {
            riskEvents.push({
              id: uid('event'),
              patientId,
              patientName,
              eventType: i % 2 === 0 ? '健康数据异常提示' : '患者主动反馈',
              description: i % 2 === 0 ? '模拟记录显示近三天活动量低于计划目标。' : '模拟记录显示患者偶有胸闷不适，需进一步观察。',
              eventTime: `2026-10-${String(14 + (i % 6)).padStart(2, '0')}T09:30:00`,
              status: ['待评估', '处理中', '已完成', '待联系'][i % 4],
              isDemo: true
            });
          }
        }

        recalcTaskProgress({ patients, healthRecords, rehabPlans, rehabTasks, followUps, riskEvents, educationArticles });

        return { patients, healthRecords, rehabPlans, rehabTasks, followUps, riskEvents, educationArticles, aiKnowledgeBase: AI_KB, lastUpdated: new Date().toISOString() };
      }

      function readStore() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) {
            const initial = generateSeedData();
            localStorage.setItem(STORAGE_KEY, JSON.stringify(initial));
            return initial;
          }
          const parsed = JSON.parse(raw);
          if (!parsed || !parsed.patients || !Array.isArray(parsed.patients)) {
            const initial = generateSeedData();
            localStorage.setItem(STORAGE_KEY, JSON.stringify(initial));
            return initial;
          }
          if (!parsed.rehabTasks) parsed.rehabTasks = [];
          if (!parsed.educationArticles) parsed.educationArticles = defaultEducationArticles.map((article, index) => ({ id: uid('article'), articleId: `A${String(index+1).padStart(3,'0')}`, ...article, isDemo: true }));
          recalcTaskProgress(parsed);
          return parsed;
        } catch (error) {
          console.warn('readStore failed', error);
          const initial = generateSeedData();
          localStorage.setItem(STORAGE_KEY, JSON.stringify(initial));
          return initial;
        }
      }

        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));

      function setToast(message) {
        const toast = document.getElementById('globalToast');
        if (!toast) return;
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(setToast.timer);
        setToast.timer = setTimeout(() => toast.classList.remove('show'), 2200);
      }

      function bindAiInteractions() {
        const input = document.getElementById('aiQuestionInput');
        const button = document.getElementById('aiSearchBtn');
        const filter = document.getElementById('aiCategoryFilter');
        const panel = document.getElementById('aiAnswerPanel');
        if (!input || !button || !filter || !panel) return;
        const refresh = () => {
          appState.aiQuery = input.value.trim();
          appState.aiCategory = filter.value;
          panel.innerHTML = renderAiAnswerPanel(appState.aiQuery, appState.aiCategory);
          panel.querySelectorAll('[data-ai-question]').forEach(node => {
            node.addEventListener('click', () => {
              input.value = node.getAttribute('data-ai-question');
              appState.aiQuery = input.value.trim();
              refresh();
            });
          });
          panel.querySelectorAll('[data-ai-category]').forEach(node => {
            node.addEventListener('click', () => {
              filter.value = node.getAttribute('data-ai-category');
              appState.aiCategory = filter.value;
              refresh();
            });
          });
          panel.querySelectorAll('[data-ai-edu]').forEach(node => {
            node.addEventListener('click', () => {
              const category = node.getAttribute('data-ai-edu');
              appState.aiCategory = category;
              location.hash = '#/education';
            });
          });
        };
        button.addEventListener('click', refresh);
        input.addEventListener('keydown', event => {
          if (event.key === 'Enter') refresh();
        });
        filter.addEventListener('change', refresh);
        document.querySelectorAll('[data-ai-question]').forEach(node => {
          node.addEventListener('click', () => {
            input.value = node.getAttribute('data-ai-question');
            appState.aiQuery = input.value.trim();
            refresh();
          });
        });
        document.querySelectorAll('[data-ai-category]').forEach(node => {
          node.addEventListener('click', () => {
            filter.value = node.getAttribute('data-ai-category');
            appState.aiCategory = filter.value;
            refresh();
          });
        });
      }

      function bindPatientInteractions() {
        document.querySelectorAll('[data-patient-select]').forEach(node => {
          node.addEventListener('click', () => {
            const patientId = node.getAttribute('data-patient-select');
            appState.selectedPatientId = patientId;
            renderApp();
          });
        });

        const healthForm = document.getElementById('healthRecordForm');
        if (healthForm) {
          healthForm.addEventListener('submit', event => {
            event.preventDefault();
            const store = readStore();
            const patientId = (healthForm.elements.patientId.value || appState.selectedPatientId || store.patients[0]?.id);
            const patient = getPatientById(store, patientId);
            if (!patient) {
              setToast('未找到对应患者');
              return;
            }
            const formData = new FormData(healthForm);
            const record = {
              id: uid('record'),
              patientId,
              date: formData.get('date') || new Date().toISOString().slice(0,10),
              systolic: Number(formData.get('systolic')),
              diastolic: Number(formData.get('diastolic')),
              heartRate: Number(formData.get('heartRate')),
              weight: Number(formData.get('weight')),
              workoutMinutes: Number(formData.get('workoutMinutes')),
              sleepHours: Number(formData.get('sleepHours')),
              note: '模拟数据：新增健康记录',
              isDemo: true
            };
            store.healthRecords.push(record);
            patient.lastRecordDate = record.date;
            store.lastUpdated = new Date().toISOString();
            writeStore(store);
            renderApp();
            setToast('已新增健康记录并同步更新统计');
          });
        }

        const followUpForm = document.getElementById('followUpForm');
        if (followUpForm) {
          followUpForm.addEventListener('submit', event => {
            event.preventDefault();
            const store = readStore();
            const patientId = followUpForm.elements.patientId.value || appState.selectedPatientId || store.patients[0]?.id;
            const patient = getPatientById(store, patientId);
            if (!patient) {
              setToast('未找到对应患者');
              return;
            }
            const formData = new FormData(followUpForm);
            const followUp = {
              id: uid('followup'),
              patientId,
              patientName: patient.name,
              dueDate: formData.get('dueDate') || new Date().toISOString().slice(0,10),
              method: formData.get('method') || '电话随访',
              status: '待随访',
              result: '模拟数据：新增随访记录，待患者反馈。',
              note: String(formData.get('note') || '模拟数据：新增随访记录'),
              isDemo: true
            };
            store.followUps.push(followUp);
            store.lastUpdated = new Date().toISOString();
            writeStore(store);
            renderApp();
            setToast('已新增随访记录并同步更新患者详情');
          });
        }

        document.querySelectorAll('.toggle-task-btn').forEach(button => {
          button.addEventListener('click', () => {
            const store = readStore();
            const taskId = button.getAttribute('data-task-id');
            const task = (store.rehabTasks || []).find(item => item.id === taskId);
            if (!task) return;
            task.status = task.status === '已完成' ? '待完成' : '已完成';
            recalcTaskProgress(store);
            store.lastUpdated = new Date().toISOString();
            writeStore(store);
            renderApp();
            setToast(task.status === '已完成' ? '已完成康复任务并更新统计' : '任务状态已更新');
          });
        });
      }

                  <div class="flex h-11 w-11 items-center justify-center rounded-xl bg-gradient-to-br from-medical-500 to-medical-700 text-lg font-bold text-white">心</div>
                  <div>
                    <div class="text-[10px] font-semibold uppercase tracking-[0.2em] text-slate-500">CVD CARE</div>
                    <div class="text-base font-bold text-slate-800">心血管疾病居家康复数字平台</div>
                  </div>
                </div>
                <div class="flex flex-wrap items-center gap-2">
                  ${NAV_ITEMS.map(item => navLink(item.path)).join('')}
                </div>
              </div>
            </header>

            <main class="mx-auto max-w-6xl">
              <div class="mb-4 flex items-center justify-between gap-3">
                <div class="text-sm text-slate-500">当前路径：${routeMeta[page]}</div>
                <div class="flex items-center gap-2">
                  <span class="chip bg-cyan-50 text-cyan-700">模拟数据</span>
                  <span class="chip bg-emerald-50 text-emerald-700">${stats.totalPatients} 患者</span>
                </div>
              </div>
              ${renderRouteContent(page, store)}
            </main>
          </div>
          <div id="globalToast" class="toast fixed bottom-5 right-5 rounded-xl bg-slate-900 px-4 py-2 text-sm font-medium text-white shadow-lg"></div>
        `;

        if (page === '/ai') bindAiInteractions();
        if (page === '/patients') bindPatientInteractions();
        if (page === '/home') {
          document.getElementById('resetDemoData')?.addEventListener('click', () => {
            resetStore();
            setToast('已恢复演示初始数据');
          });
        }
        if (page === '/patients') {
          bindPatientInteractions();
        }
      }

      function navLink(path) {
        return `<a href="#${path}" class="nav-link ${location.hash === '#' + path || (!location.hash && path === '/home') ? 'active' : ''} inline-flex items-center gap-2 rounded-full px-3 py-2 text-sm font-semibold text-slate-600">${NAV_ITEMS.find(item => item.path === path)?.label || '首页'}</a>`;
      }

      window.addEventListener('hashchange', renderApp);
      renderApp();
    </script>
  </body>
</html>
