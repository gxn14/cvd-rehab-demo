      function safeString(value) { return value == null ? '' : String(value); }
      function formatDate(dateValue) {
        if (!dateValue) return '—';
        const d = new Date(dateValue + 'T00:00:00');
        if (Number.isNaN(d.getTime())) return dateValue;
        return d.toLocaleDateString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit' });
      }
      function formatDateTime(dateValue) {
        if (!dateValue) return '—';
        const d = new Date(dateValue);
        if (Number.isNaN(d.getTime())) return dateValue;
        return d.toLocaleString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
      }
      function uid(prefix='id') {
        return prefix + '-' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-6);
      }

      function readStore() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) {

          return initial;
        }
      }

      function getStore() {
        return readStore();

      function getPatientRecords(patientId) {
        const store = getStore();
        return store.healthRecords.filter(r => r.patientId === patientId).sort((a, b) => new Date(a.date) - new Date(b.date));
      }

      function getPatientFollowUps(patientId) {
        const store = getStore();
        return store.followUps.filter(item => item.patientId === patientId).sort((a, b) => new Date(a.planDate) - new Date(b.planDate));
      }

      function getPatientEvents(patientId) {
        const store = getStore();
        return store.riskEvents.filter(item => item.patientId === patientId).sort((a, b) => new Date(b.eventTime) - new Date(a.eventTime));
      }

      function getPatientTasks(patientId) {
        const store = getStore();
        return store.rehabTasks.filter(item => item.patientId === patientId);
      }

      function getHealthSummary(patientId) {
        const records = getPatientRecords(patientId);
        if (!records.length) {
          return {
            lastSystolic: '—', lastDiastolic: '—', lastHeartRate: '—', lastWeight: '—', lastSleep: '—', lastSteps: '—', completionRate: 0, days: 0
          };
        }
        const latest = records[records.length - 1];
        const completed = records.filter(r => r.selfManagement === '良好').length;
        return {
          lastSystolic: latest.systolic,
          lastDiastolic: latest.diastolic,
          lastHeartRate: latest.heartRate,
          lastWeight: latest.weight,
          lastSleep: latest.sleepHours,
          lastSteps: latest.steps,
          completionRate: Math.round((completed / records.length) * 100),
          days: records.length
        };
      }

        const pendingEvents = store.riskEvents.filter(item => item.status !== '已完成').length;

        const rehabCompletion = planRates.length ? (planRates.reduce((sum, v) => sum + v, 0) / planRates.length) : 0;
        const newPatients = store.patients.filter(item => item.archiveDate && item.archiveDate.startsWith('2026-10')).length || 8;
        return {

          openFollowUps,
          todayRecords,
          pendingEvents,
          rehabCompletion: Number(rehabCompletion.toFixed(1)),
          newPatients
        };

      function renderPatientsPage() {
        const store = getStore();
        const query = (document.getElementById('patientQuery') || {}).value || '';
        const level = (document.getElementById('patientLevel') || {}).value || 'all';
        const statusFilter = (document.getElementById('patientStatus') || {}).value || 'all';
        const sortBy = (document.getElementById('patientSort') || {}).value || 'id';

        let patients = [...store.patients];
        const q = query.trim().toLowerCase();
        if (q) {
          patients = patients.filter(item => item.id.toLowerCase().includes(q) || item.name.toLowerCase().includes(q));
        }
        if (level !== 'all') patients = patients.filter(item => item.managementLevel === level);
        if (statusFilter !== 'all') patients = patients.filter(item => item.status === statusFilter);
        patients.sort((a, b) => {
          if (sortBy === 'latestVisit') return new Date(b.archiveDate) - new Date(a.archiveDate);
          if (sortBy === 'name') return a.name.localeCompare(b.name, 'zh-CN');
          return a.id.localeCompare(b.id);
        });

        const pageSize = 8;
        const currentPage = Number((document.getElementById('patientPage') || {}).dataset.page || 1);
        const totalPages = Math.max(1, Math.ceil(patients.length / pageSize));
        const paged = patients.slice((currentPage - 1) * pageSize, currentPage * pageSize);

        return `
          <section class="panel p-5 md:p-7">
            <div class="mb-5 flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
              <div>
                <div class="label">Patient list</div>
                <h3 class="mt-1 text-2xl font-bold text-slate-800">患者列表</h3>
              </div>
              <div class="rounded-full border border-slate-200 bg-slate-50 px-3 py-1 text-xs font-medium text-slate-600">共 ${patients.length} 名模拟患者</div>
            </div>

            <div class="mb-5 grid gap-3 md:grid-cols-4">
              <input id="patientQuery" value="${escapeHtml(q)}" placeholder="搜索编号/姓名" class="rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-200" />
              <select id="patientLevel" class="rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-sm">
                <option value="all">全部等级</option>
                <option value="常规管理" ${level === '常规管理' ? 'selected' : ''}>常规管理</option>
                <option value="重点关注" ${level === '重点关注' ? 'selected' : ''}>重点关注</option>
              </select>
              <select id="patientStatus" class="rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-sm">
                <option value="all">全部状态</option>
                <option value="稳定" ${statusFilter === '稳定' ? 'selected' : ''}>稳定</option>
                <option value="观察中" ${statusFilter === '观察中' ? 'selected' : ''}>观察中</option>
                <option value="关注中" ${statusFilter === '关注中' ? 'selected' : ''}>关注中</option>
                <option value="待复诊" ${statusFilter === '待复诊' ? 'selected' : ''}>待复诊</option>
              </select>
              <select id="patientSort" class="rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-sm">
                <option value="id" ${sortBy === 'id' ? 'selected' : ''}>按编号</option>
                <option value="name" ${sortBy === 'name' ? 'selected' : ''}>按姓名</option>
                <option value="latestVisit" ${sortBy === 'latestVisit' ? 'selected' : ''}>按建档时间</option>
              </select>
            </div>

            <div class="table-scroll">
              <table>
                <thead>
                  <tr class="bg-slate-50 text-sm text-slate-600">
                    <th>患者编号</th>
                    <th>姓名</th>
                    <th>年龄</th>
                    <th>性别</th>
                    <th>主要疾病</th>
                    <th>居住地区</th>
                    <th>管理等级</th>
                    <th>最近随访日期</th>
                    <th>最近记录日期</th>
                    <th>状态</th>
                  </tr>
                </thead>
                <tbody>
                  ${paged.length ? paged.map(patient => {
                    const latestFollowUp = getPatientFollowUps(patient.id).slice(-1)[0];
                    const latestRecord = getPatientRecords(patient.id).slice(-1)[0];
                    return `
                      <tr class="hover:bg-slate-50">
                        <td><button data-open-patient="${patient.id}" class="font-semibold text-medical-700 hover:underline">${patient.id}</button></td>
                        <td><button data-open-patient="${patient.id}" class="font-bold text-slate-800 hover:underline">${patient.name}</button></td>
                        <td>${patient.age}</td>
                        <td>${patient.gender}</td>
                        <td>${patient.diagnosis}</td>
                        <td>${patient.region}</td>
                        <td><span class="status-chip ${statusPillClass(patient.managementLevel)}">${patient.managementLevel}</span></td>
                        <td>${latestFollowUp ? formatDate(latestFollowUp.planDate) : '—'}</td>
                        <td>${latestRecord ? formatDate(latestRecord.date) : '—'}</td>
                        <td><span class="status-chip ${statusPillClass(patient.status)}">${patient.status}</span></td>
                      </tr>
                    `;
                  }).join('') : '<tr><td colspan="10" class="py-8 text-center text-slate-500">暂无匹配患者</td></tr>'}
                </tbody>
              </table>
            </div>

            <div class="mt-5 flex flex-wrap items-center justify-between gap-3">
              <div class="text-sm text-slate-600">第 ${currentPage}/${totalPages} 页</div>
              <div class="flex gap-2">
                <button data-patient-page="prev" class="soft-button" ${currentPage <= 1 ? 'disabled' : ''}>上一页</button>
                <button data-patient-page="next" class="soft-button" ${currentPage >= totalPages ? 'disabled' : ''}>下一页</button>
              </div>
            </div>
          </section>
        `;
      }

              </div>
              <div class="rounded-2xl border border-dashed border-slate-300 bg-slate-50 p-4">
                <div class="text-lg font-bold text-slate-800">${question.question}</div>
                <div class="mt-4 grid gap-4 md:grid-cols-2">
                  ${question.options.map((option, optionIndex) => `
                    <button type="button" data-dce-choice="${option.label}" class="rounded-2xl border ${chosen === option.label ? 'border-medical-300 bg-medical-50' : 'border-slate-200 bg-slate-50'} p-4 text-left">
                      <div class="text-xs font-semibold uppercase tracking-[0.18em] text-slate-500">${option.label}</div>
                      <div class="mt-2 text-base font-bold text-slate-800">${option.description}</div>
                    </button>
                  `).join('')}
                </div>
                <div class="mt-4 flex gap-3">
                  <button type="button" data-dce-nav="prev" class="soft-button">上一题</button>
                  <button type="button" data-dce-nav="next" class="rounded-xl bg-medical-700 px-4 py-2 text-sm font-semibold text-white hover:bg-medical-800">下一题</button>
                </div>
              </div>
            </div>
          </section>
        `;
      }

      function renderSystemPage() {
        return `
          <section class="space-y-6">
            <div class="panel p-5 md:p-7">
              <div class="mb-4">
                <div class="label">System statement</div>
                <h3 class="mt-1 text-2xl font-bold text-slate-800">系统说明</h3>
              </div>
              <div class="space-y-4 text-sm leading-7 text-slate-700">
                <p>${DEMO_NOTICE}</p>
                <p>本原型使用浏览器 localStorage 进行模拟数据持久化，便于在 GitHub Pages 上直接运行。浏览器本地存储不适用于正式患者数据的安全存储。</p>
                <p>本版本不接入真实AI服务、不接入数据库、不要求登录，也不使用真实患者姓名或身份信息。</p>
                <p>所有健康数据、风险事件和DCE题目仅作界面演示和交互测试，不能用于真实临床诊疗或正式研究结论。</p>
                <p>页面保留可点击的研究原型路径，便于在桌面和移动端进行演示与测试。</p>
                <button id="resetDemoData" class="rounded-xl bg-risk-500 px-4 py-2 text-sm font-semibold text-white hover:bg-risk-600">恢复初始模拟数据</button>
              </div>
            </div>
          </section>
        `;
      }

      function typeLabel(type) {
        const map = {
          bloodPressure: '血压',
          heartRate: '心率',
          weight: '体重',
          exercise: '运动',
          sleep: '睡眠',
          selfManagement: '自我管理'
        };
        return map[type] || '其他';
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function bindPageInteractions() {
        document.querySelectorAll('[data-route]').forEach(el => {
          el.addEventListener('click', () => {
            const route = el.getAttribute('data-route');
            if (route) {
              location.hash = route;
            }
          });
        });

        document.querySelectorAll('[data-open-patient]').forEach(btn => {
          btn.addEventListener('click', () => {
            const patientId = btn.getAttribute('data-open-patient');
            location.hash = `/patients/${patientId}`;
          });
        });

        document.querySelectorAll('[data-patient-page]').forEach(btn => {
          btn.addEventListener('click', () => {
            let currentPage = Number((document.getElementById('patientPage') || {}).dataset.page || 1);
            const direction = btn.getAttribute('data-patient-page');
            if (direction === 'next') currentPage += 1; else if (direction === 'prev') currentPage -= 1;
            const pageBox = document.getElementById('patientPage');
            if (!pageBox) {
              const newPage = document.createElement('div');
              newPage.id = 'patientPage';
              newPage.dataset.page = String(currentPage);
            }
            document.getElementById('patientPage')?.setAttribute('data-page', String(currentPage));
            renderApp();
          });
        });

        const patientQuery = document.getElementById('patientQuery');
        if (patientQuery) {
          patientQuery.addEventListener('input', () => renderApp());
        }
        const patientLevel = document.getElementById('patientLevel');
        if (patientLevel) patientLevel.addEventListener('change', () => renderApp());
        const patientStatus = document.getElementById('patientStatus');
        if (patientStatus) patientStatus.addEventListener('change', () => renderApp());
        const patientSort = document.getElementById('patientSort');
        if (patientSort) patientSort.addEventListener('change', () => renderApp());

        const healthPatientSelect = document.getElementById('healthPatientSelect');
        if (healthPatientSelect) healthPatientSelect.addEventListener('change', () => renderApp());
        const healthTypeFilter = document.getElementById('healthTypeFilter');
        if (healthTypeFilter) healthTypeFilter.addEventListener('change', () => renderApp());

        const newHealthBtn = document.getElementById('newHealthRecord');
        if (newHealthBtn) {
          newHealthBtn.addEventListener('click', () => {
            const panel = document.getElementById('healthFormPanel');
            if (panel) panel.style.display = 'block';
            document.getElementById('healthForm').reset();
            document.getElementById('healthFormPatient').value = document.getElementById('healthPatientSelect')?.value || '';
          });
        }

        const cancelHealth = document.getElementById('cancelHealthForm');
        if (cancelHealth) {
          cancelHealth.addEventListener('click', () => {
            const panel = document.getElementById('healthFormPanel');
            if (panel) panel.style.display = 'none';
          });
        }

        const healthForm = document.getElementById('healthForm');
        if (healthForm) {
          healthForm.addEventListener('submit', (event) => {
            event.preventDefault();
            const store = getStore();
            const patientId = document.getElementById('healthFormPatient').value;
            const date = document.getElementById('healthFormDate').value;
            const type = document.getElementById('healthFormType').value;
            const systolic = Number(document.getElementById('healthFormSystolic').value || 0);
            const diastolic = Number(document.getElementById('healthFormDiastolic').value || 0);
            const heartRate = Number(document.getElementById('healthFormHeartRate').value || 0);
            const weight = Number(document.getElementById('healthFormWeight').value || 0);
            const steps = Number(document.getElementById('healthFormSteps').value || 0);
            const sleepHours = Number(document.getElementById('healthFormSleep').value || 0);
            const selfManagement = document.getElementById('healthFormSelfManagement').value;
            const note = document.getElementById('healthFormNote').value;
            if (!patientId || !date) return setStatus('患者和测量日期不能为空');
            if (type === 'bloodPressure' && (!Number.isFinite(systolic) || !Number.isFinite(diastolic) || systolic <= 0 || diastolic <= 0)) return setStatus('血压必须为合理数值');
            if (type === 'heartRate' && (!Number.isFinite(heartRate) || heartRate <= 0)) return setStatus('心率必须为合理数值');
            if (type === 'weight' && (!Number.isFinite(weight) || weight <= 0)) return setStatus('体重必须为合理数值');
            if (type === 'exercise' && (!Number.isFinite(steps) || steps < 0)) return setStatus('步数必须为非负数');
            if (type === 'sleep' && (!Number.isFinite(sleepHours) || sleepHours < 0)) return setStatus('睡眠时间需为合理数值');
            const record = {
              id: document.getElementById('healthRecordId').value || uid('record'),
              patientId,
              date,
              type,
              systolic: systolic || 0,
              diastolic: diastolic || 0,
              heartRate: heartRate || 0,
              weight: weight || 0,
              steps: steps || 0,
              sleepHours: sleepHours || 0,
              selfManagement,
              note,
              isDemo: true
            };
            const idx = store.healthRecords.findIndex(item => item.id === record.id);
            if (idx >= 0) store.healthRecords[idx] = record; else store.healthRecords.push(record);
            writeStore(store);
            setStatus('健康记录已保存');
            renderApp();
          });
        }

        document.querySelectorAll('[data-edit-health]').forEach(btn => {
          btn.addEventListener('click', () => {
            const recordId = btn.getAttribute('data-edit-health');
            const store = getStore();
            const record = store.healthRecords.find(item => item.id === recordId);
            if (!record) return;
            document.getElementById('healthRecordId').value = record.id;
            document.getElementById('healthFormPatient').value = record.patientId;
            document.getElementById('healthFormDate').value = record.date;
            document.getElementById('healthFormType').value = record.type;
            document.getElementById('healthFormSelfManagement').value = record.selfManagement || '良好';
            document.getElementById('healthFormSystolic').value = record.systolic || '';
            document.getElementById('healthFormDiastolic').value = record.diastolic || '';
            document.getElementById('healthFormHeartRate').value = record.heartRate || '';
            document.getElementById('healthFormWeight').value = record.weight || '';
            document.getElementById('healthFormSteps').value = record.steps || '';
            document.getElementById('healthFormSleep').value = record.sleepHours || '';
            document.getElementById('healthFormNote').value = record.note || '';
            document.getElementById('healthFormPanel').style.display = 'block';
          });
        });

        document.querySelectorAll('[data-delete-health]').forEach(btn => {
          btn.addEventListener('click', () => {
            if (!confirm('确认删除该健康记录吗？')) return;
            const recordId = btn.getAttribute('data-delete-health');
            const store = getStore();
            store.healthRecords = store.healthRecords.filter(item => item.id !== recordId);
            writeStore(store);
            setStatus('健康记录已删除');
            renderApp();
          });
        });

        const newFollowupBtn = document.getElementById('newFollowupBtn');
        if (newFollowupBtn) {
          newFollowupBtn.addEventListener('click', () => {
            document.getElementById('followupFormPanel').style.display = 'block';
          });
        }

        const cancelFollowup = document.getElementById('cancelFollowup');
        if (cancelFollowup) {
          cancelFollowup.addEventListener('click', () => {
            document.getElementById('followupFormPanel').style.display = 'none';
          });
        }

        const followUpForm = document.getElementById('followUpForm');
        if (followUpForm) {
          followUpForm.addEventListener('submit', (event) => {
            event.preventDefault();
            const store = getStore();
            const patientId = document.getElementById('followPatient').value;
            const patient = getPatientById(patientId);
            const data = {
              id: uid('follow'),
              patientId,
              patientName: patient?.name || '模拟患者',
              planDate: document.getElementById('followDate').value,
              actualDate: document.getElementById('followDate').value,
              method: document.getElementById('followMethod').value,
              staff: document.getElementById('followStaff').value,
              status: '待随访',
              result: document.getElementById('followSelfManagement').value || '已完成初步沟通',
              nextPlan: document.getElementById('followNextPlan').value,
              note: document.getElementById('followNote').value,
              isDemo: true
            };
            store.followUps.push(data);
            writeStore(store);
            setStatus('随访记录已新增');
            renderApp();
          });
        }

        document.querySelectorAll('[data-open-event]').forEach(btn => {
          btn.addEventListener('click', () => {
            const eventId = btn.getAttribute('data-open-event');
            const store = getStore();
            const item = store.riskEvents.find(event => event.id === eventId);
            if (!item) return;
            const note = prompt(`处理记录：\n${item.description}\n\n状态（待评估/待联系/处理中/已完成）`, item.processNote || '已登记');
            if (note == null) return;
            item.processNote = note;
            item.status = '已完成';
            item.handler = '护士组';
            item.processedAt = new Date().toISOString();
            writeStore(store);
            setStatus('风险事件已更新');
            renderApp();
          });
        });

        document.querySelectorAll('[data-article]').forEach(btn => {
          btn.addEventListener('click', () => {
            const id = btn.getAttribute('data-article');
            localStorage.setItem('cvd-article-select', id);
            renderApp();
          });
        });

        const articleId = localStorage.getItem('cvd-article-select');
        if (articleId) {
          const article = document.querySelector(`button[data-article="${articleId}"]`);
          if (article) article.click();
        }

        document.querySelectorAll('[data-ai-suggestion]').forEach(btn => {
          btn.addEventListener('click', () => {
            const val = btn.getAttribute('data-ai-suggestion');
            const input = document.getElementById('aiQuestionInput');
            if (input) input.value = val;
          });
        });

        const aiForm = document.getElementById('aiForm');
        if (aiForm) {
          aiForm.addEventListener('submit', (event) => {
            event.preventDefault();
            const input = document.getElementById('aiQuestionInput');
            const value = (input?.value || '').trim();
            if (!value) return setStatus('请输入问题');
            const store = getStore();
            const matched = store.qaKnowledgeBase.find(item => item.question.toLowerCase().includes(value.toLowerCase()) || value.toLowerCase().includes(item.question.toLowerCase().slice(0, 8)));
            const answerText = matched ? `Q: ${matched.question}\nA: ${matched.answer}\n\n适用范围：${matched.scope}\n注意事项：${matched.caution}\n来源：${matched.sourceName}\n链接：${matched.sourceUrl || '待补充'}\n审核状态：${matched.status}` : '当前演示知识库未找到经过审核的相关回答，请咨询专业医护人员。';
            const answerBlock = document.getElementById('aiAnswerBlock');
            if (answerBlock) {
              answerBlock.dataset.answer = answerText;
              answerBlock.innerHTML = `<div class="mb-3 label">Response</div><div class="text-sm leading-7 text-slate-700">${escapeHtml(answerText).replace(/\n/g, '<br>')}</div>`;
            }
            setStatus('问答已生成');
          });
        }

        const clearAiQuestion = document.getElementById('clearAiQuestion');
        if (clearAiQuestion) {
          clearAiQuestion.addEventListener('click', () => {
            const input = document.getElementById('aiQuestionInput');
            if (input) input.value = '';
          });
        }

        const profileType = document.getElementById('profileType');
        if (profileType) profileType.addEventListener('change', () => renderApp());

        document.querySelectorAll('[data-dce-choice]').forEach(btn => {
          btn.addEventListener('click', () => {
            const value = btn.getAttribute('data-dce-choice');
            const field = document.getElementById('dceAnswerValue');
            if (field) field.value = value;
            document.querySelectorAll('[data-dce-choice]').forEach(item => item.classList.remove('border-medical-300', 'bg-medical-50'));
            btn.classList.add('border-medical-300', 'bg-medical-50');
          });
        });

        const dceAnswerValue = document.createElement('input');
        dceAnswerValue.type = 'hidden';
        dceAnswerValue.id = 'dceAnswerValue';
        dceAnswerValue.value = '方案A';
        if (!document.getElementById('dceAnswerValue')) {
          document.getElementById('dceAnswerValue')?.remove();
        }

        document.querySelectorAll('[data-dce-nav]').forEach(btn => {
          btn.addEventListener('click', () => {
            const current = Number((document.getElementById('dceIndex') || {}).value || 0);
            const nav = btn.getAttribute('data-dce-nav');
            const next = nav === 'next' ? current + 1 : current - 1;
            const field = document.getElementById('dceIndex');
            if (field) field.value = String(Math.min(Math.max(next, 0), 5));
            renderApp();
          });
        });

        const resetBtn = document.getElementById('resetDemoData');
        if (resetBtn) {
          resetBtn.addEventListener('click', () => {
            if (!confirm('确认恢复初始模拟数据？这会覆盖当前本地更改。')) return;
            const fresh = buildDemoRecords();
            writeStore(fresh);
            setStatus('已恢复初始模拟数据');
            renderApp();
          });
        }

        const route = location.hash.replace(/^#/, '') || '/home';
        if (route.startsWith('/patients/') && route.split('/').length > 2) {
          const patientId = route.split('/')[2];
          const patient = getPatientById(patientId);
          if (patient) {
            const patientPanel = document.createElement('div');
            patientPanel.innerHTML = renderPatientDetail(patientId);
            const oldContent = document.getElementById('contentArea');
            oldContent.innerHTML = patientPanel.innerHTML;
            bindPageInteractions();
          }
        }
      }

      window.addEventListener('hashchange', renderApp);
      window.addEventListener('DOMContentLoaded', () => {
        if (!location.hash) location.hash = '/home';
        renderApp();
      });
    </script>
  </body>
</html>
